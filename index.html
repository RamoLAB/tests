<!DOCTYPE html>
<html>
<head>
    <title>Micro Craft 2D - Survival</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 10px; border-radius: 5px; pointer-events: none; display: none; }
        #resetBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 20px; cursor: pointer; display: none; background: #333; color: white; border: 2px solid white; border-radius: 10px; pointer-events: auto; }
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid white; }
        #menu button, #menu input { padding: 10px; font-size: 16px; margin: 5px; cursor: pointer; }
        #menu input { cursor: text; text-align: center; }
    </style>
</head>
<body>
<div id="menu">
    <h2>MICRO CRAFT SURVIVAL - P2P</h2>
    <div id="setupStep">
        <label>Quantidade de Jogadores:</label><br>
        <button onclick="setMaxPlayers(2)">2 Jogadores</button>
        <button onclick="setMaxPlayers(3)">3 Jogadores</button>
        <button onclick="setMaxPlayers(4)">4 Jogadores</button>
    </div>
    <div id="roomStep" style="display:none;">
        <p>Jogadores selecionados: <b id="maxPCount"></b></p>
        <button onclick="createRoom()">Criar Sala</button><br><br>
        OU<br><br>
        <input type="text" id="joinIdInput" placeholder="Cole o ID do Host"><br>
        <button onclick="joinRoom()">Entrar em Sala</button>
    </div>
    <div id="statusStep" style="display:none;">
        <p id="statusMsg">Aguardando conexões...</p>
        <p id="roomCodeArea" style="display:none;">ID da Sala: <b id="roomCode"></b></p>
    </div>
</div>

<div id="ui">
    <b>MICRO CRAFT SURVIVAL</b><br>
    Controles: WASD ou Setas<br>
    Minerar: Botão Esq. | Construir: Botão Dir.<br>
    Tempo p/ Eliminação: <span id="timer">30</span>s<br>
    <span id="invList"></span>
</div>
<button id="resetBtn" onclick="resetGame()">REINICIAR PARTIDA</button>
<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const timerDisp = document.getElementById('timer');
    const resetBtn = document.getElementById('resetBtn');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const blockSize = Math.floor(canvas.width / 35);
    let world = {};
    let fallingBlocks = [];
    let gameActive = false;
    let globalTimer = 30;
    let shakeTimer = 0;
    let eliminationPending = false;
    let players = [];
    let startRow = 11;
    let dangerRowOffset = -3;

    let camX = canvas.width / 2;
    let camY = canvas.height / 2;
    let zoom = 1;

    let peer = null;
    let myId = null;
    let myIndex = -1;
    let isHost = false;
    let maxPlayers = 2;
    let connections = [];
    let hostConn = null;
    let lastSyncTime = 0;

    const colors = ['#f00', '#00f', '#ff0', '#f0f'];
    const spawnPositions = [5, 30, 15, 20];

    function setMaxPlayers(num) {
        maxPlayers = num;
        document.getElementById('maxPCount').innerText = num;
        document.getElementById('setupStep').style.display = 'none';
        document.getElementById('roomStep').style.display = 'block';
    }

    function createRoom() {
        isHost = true;
        myIndex = 0;
        document.getElementById('roomStep').style.display = 'none';
        document.getElementById('statusStep').style.display = 'block';
        document.getElementById('statusMsg').innerText = "Gerando sala...";

        peer = new Peer();
        peer.on('open', id => {
            myId = id;
            document.getElementById('roomCodeArea').style.display = 'block';
            document.getElementById('roomCode').innerText = id;
            document.getElementById('statusMsg').innerText = `Aguardando jogadores (1/${maxPlayers})...`;
        });

        peer.on('connection', conn => {
            if (connections.length + 1 >= maxPlayers) {
                conn.close();
                return;
            }
            connections.push(conn);
            let playerIdx = connections.length;

            conn.on('open', () => {
                conn.send({ type: 'init', playerIndex: playerIdx, maxPlayers: maxPlayers });
                updateHostLobby();
            });

            conn.on('data', data => handleData(data, playerIdx));
            conn.on('close', () => {
                let idx = connections.indexOf(conn);
                if(idx !== -1) connections.splice(idx, 1);
            });
        });
    }

    function joinRoom() {
        let hostId = document.getElementById('joinIdInput').value.trim();
        if(!hostId) return;
        isHost = false;

        document.getElementById('roomStep').style.display = 'none';
        document.getElementById('statusStep').style.display = 'block';
        document.getElementById('statusMsg').innerText = "Conectando à sala...";

        peer = new Peer();
        peer.on('open', id => {
            myId = id;
            hostConn = peer.connect(hostId);
            hostConn.on('open', () => {
                document.getElementById('statusMsg').innerText = "Conectado! Aguardando o Host iniciar...";
            });
            hostConn.on('data', data => handleData(data, -1));
        });
    }

    function updateHostLobby() {
        let total = connections.length + 1;
        document.getElementById('statusMsg').innerText = `Aguardando jogadores (${total}/${maxPlayers})...`;
        if (total === maxPlayers) {
            startGameAsHost();
        }
    }

    function startGameAsHost() {
        initGameWorld();
        let payload = { type: 'start', world, players, startRow, dangerRowOffset };
        connections.forEach(c => c.send(payload));
        document.getElementById('menu').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        updateUIInv();
        gameActive = true;
    }

    function initGameWorld() {
        world = {};
        fallingBlocks = [];
        globalTimer = 30;
        shakeTimer = 0;
        eliminationPending = false;
        resetBtn.style.display = 'none';
        startRow = 11;
        dangerRowOffset = -3;

        for(let r = 0; r < 3; r++) {
            for(let x = 1; x < 35; x++) {
                world[`${x},${startRow + r}`] = r === 0 ? '#3a3' : (r === 1 ? '#753' : '#555');
            }
        }

        players = [];
        for(let i = 0; i < maxPlayers; i++) {
            players.push(createPlayer(i, blockSize * spawnPositions[i], (startRow - 2) * blockSize, colors[i]));
        }

        camX = canvas.width / 2;
        camY = (startRow * blockSize);
        zoom = 1;
    }

    function createPlayer(id, x, y, color) {
        return {
            id, x, y, color, isAI: false,
            w: blockSize * 0.7,
            h: blockSize * 1.2,
            vx: 0, vy: 0,
            inventory: 0,
            alive: true, dying: false,
            isGrounded: false, isCrouching: false,
            squash: 1, stretch: 1,
            targetSquash: 1, targetStretch: 1,
            angle: 0
        };
    }

    function updateUIInv() {
        let html = "";
        players.forEach(p => {
            html += `P${p.id + 1} Inv: <span id="inv${p.id}">${p.inventory}</span> `;
        });
        document.getElementById('invList').innerHTML = html;
    }

    function handleData(data, fromIdx) {
        if (data.type === 'init') {
            myIndex = data.playerIndex;
            maxPlayers = data.maxPlayers;
        } else if (data.type === 'start') {
            world = data.world;
            players = data.players;
            startRow = data.startRow;
            dangerRowOffset = data.dangerRowOffset;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            updateUIInv();
            gameActive = true;
        } else if (data.type === 'input') {
            if (isHost) {
                let p = players[fromIdx];
                if (p) {
                    p.moveLeft = data.moveLeft;
                    p.moveRight = data.moveRight;
                    p.jump = data.jump;
                    p.crouch = data.crouch;
                }
            }
        } else if (data.type === 'action') {
            if (isHost) {
                processClickAction(fromIdx, data.button, data.key);
            }
        } else if (data.type === 'sync') {
            if (!isHost) {
                players = data.players;
                globalTimer = data.globalTimer;
                shakeTimer = data.shakeTimer;
                gameActive = data.gameActive;
                fallingBlocks = data.fallingBlocks;
                timerDisp.innerText = globalTimer;
                if (!gameActive) {
                    checkVictoryUI();
                }
                players.forEach(p => {
                    let el = document.getElementById(`inv${p.id}`);
                    if(el) el.innerText = p.inventory;
                });
            }
        } else if (data.type === 'world') {
            if (!isHost) {
                world = data.world;
                startRow = data.startRow;
                dangerRowOffset = data.dangerRowOffset;
            }
        } else if (data.type === 'reset') {
            world = data.world;
            players = data.players;
            startRow = data.startRow;
            dangerRowOffset = data.dangerRowOffset;
            gameActive = true;
            resetBtn.style.display = 'none';
            updateUIInv();
        }
    }

    const keys = {};
    window.onkeydown = e => {
        if (keys[e.code]) return;
        keys[e.code] = true;
        sendInputs();
    };
    window.onkeyup = e => {
        keys[e.code] = false;
        sendInputs();
    };

    function sendInputs() {
        if (myIndex === -1 || !gameActive) return;
        let moveLeft = keys['KeyA'] || keys['ArrowLeft'];
        let moveRight = keys['KeyD'] || keys['ArrowRight'];
        let jump = keys['KeyW'] || keys['ArrowUp'];
        let crouch = keys['KeyS'] || keys['ArrowDown'];

        let msg = { type: 'input', moveLeft, moveRight, jump, crouch };
        if (isHost) {
            let p = players[myIndex];
            if (p) {
                p.moveLeft = moveLeft;
                p.moveRight = moveRight;
                p.jump = jump;
                p.crouch = crouch;
            }
        } else if (hostConn) {
            hostConn.send(msg);
        }
    }

    function getActiveRow() {
        for (let r = 0; r < 100; r++) {
            let found = false;
            for (let x = 1; x < 35; x++) {
                if (world[`${x},${startRow + r}`] && world[`${x},${startRow + r}`] !== '#888') {
                    found = true;
                    break;
                }
            }
            if (found) return startRow + r;
        }
        return -1;
    }

    window.onmousedown = e => {
        if (!gameActive || myIndex === -1) return;
        
        let worldX = (e.clientX - canvas.width / 2) / zoom + camX;
        let worldY = (e.clientY - canvas.height / 2) / zoom + camY;
        
        let wx = Math.floor(worldX / blockSize);
        let wy = Math.floor(worldY / blockSize);
        let key = `${wx},${wy}`;

        if (isHost) {
            processClickAction(myIndex, e.button, key);
        } else if (hostConn) {
            hostConn.send({ type: 'action', button: e.button, key });
        }
    };

    function broadcastWorld() {
        if (!isHost) return;
        let data = { type: 'world', world, startRow, dangerRowOffset };
        connections.forEach(c => c.send(data));
    }

    function processClickAction(pIdx, button, key) {
        let p = players[pIdx];
        if (!p || !p.alive || p.dying) return;

        let activeRowY = getActiveRow();

        if (button === 2) {
            if (p.inventory > 0 && !world[key]) {
                world[key] = '#888';
                p.inventory--;
                broadcastWorld();
            }
        } else if (button === 0) {
            if (world[key] && (parseInt(key.split(',')[1]) === activeRowY || world[key] === '#888')) {
                delete world[key];
                p.inventory++;
                broadcastWorld();
            }
        }
    }

    window.oncontextmenu = e => e.preventDefault();

    setInterval(() => {
        if (!gameActive || !isHost) return;
        globalTimer--;
        if (globalTimer <= 0) {
            shakeTimer = 40; 
            eliminationPending = true;
            globalTimer = 30;
        }
        timerDisp.innerText = globalTimer;
    }, 1000);

    function executeElimination() {
        let activeRow = getActiveRow();
        let dangerY = (activeRow + dangerRowOffset) * blockSize;
        
        players.forEach(p => {
            if (p.alive && !p.dying && (p.y + p.h) >= dangerY) {
                p.dying = true;
                p.vx = (Math.random() - 0.5) * 10;
                p.vy = -5;
            }
        });

        let newWorld = {};
        for (let key in world) {
            let [x, y] = key.split(',').map(Number);
            if (world[key] === '#888') {
                fallingBlocks.push({ x: x * blockSize, y: y * blockSize, vy: 0, color: '#888' });
            } else {
                newWorld[`${x},${y + 1}`] = world[key];
            }
        }
        world = newWorld;
        startRow++;
        dangerRowOffset -= 3;
        players.forEach(p => { if (p.alive && !p.dying) p.y += blockSize; });
        checkVictory();
        broadcastWorld();
    }

    function checkVictory() {
        let alive = players.filter(p => p.alive && !p.dying);
        if (alive.length <= 1) {
            gameActive = false;
            checkVictoryUI();
        }
    }

    function checkVictoryUI() {
        if (isHost) {
            resetBtn.style.display = 'block';
        }
    }

    function resetGame() {
        if (!isHost) return;
        initGameWorld();
        gameActive = true;
        let payload = { type: 'reset', world, players, startRow, dangerRowOffset };
        connections.forEach(c => c.send(payload));
    }

    function update() {
        if (!isHost) return;

        if (!gameActive) {
             players.forEach(p => { if(p.dying) updateDying(p); });
             updateFallingBlocks();
             broadcastSync();
             return;
        }

        updateFallingBlocks();

        let activeRowY = getActiveRow();
        let changedColor = false;
        if (activeRowY !== -1) {
            for (let x = 1; x < 35; x++) {
                if (world[`${x},${activeRowY}`] && world[`${x},${activeRowY}`] !== '#888' && world[`${x},${activeRowY}`] !== '#3a3') {
                    world[`${x},${activeRowY}`] = '#3a3';
                    changedColor = true;
                }
            }
        }
        if (changedColor) broadcastWorld();

        players.forEach(p => {
            if (!p.alive) return;
            if (p.dying) { updateDying(p); return; }

            p.isCrouching = p.crouch && p.isGrounded;

            let speed = 5;
            if (p.isCrouching) speed *= 0.4;

            if (p.moveLeft) p.vx = -speed;
            else if (p.moveRight) p.vx = speed;
            else p.vx *= 0.8;

            if (p.jump && p.isGrounded && !p.isCrouching) {
                p.vy = -12;
                p.isGrounded = false;
            }

            p.vy += 0.6;

            let nextX = p.x + p.vx;
            let nextY = p.y + p.vy;

            let gridX = Math.floor((nextX + p.w / 2) / blockSize);
            let gridY = Math.floor((nextY + p.h) / blockSize);

            if (world[`${gridX},${gridY}`]) {
                p.vy = 0;
                p.y = (gridY * blockSize) - p.h;
                p.isGrounded = true;
            } else {
                p.y = nextY;
                p.isGrounded = false;
            }
            p.x = Math.max(-blockSize * 10, Math.min(canvas.width + blockSize * 10, nextX));

            if (p.isCrouching) {
                p.targetSquash = 0.5;
                p.targetStretch = 1.6;
            } else {
                p.targetSquash = 1;
                p.targetStretch = 1;
            }

            p.squash += (p.targetSquash - p.squash) * 0.2;
            p.stretch += (p.targetStretch - p.stretch) * 0.2;
            p.angle = p.vx * 0.05;

            if (p.y > canvas.height + 1000) {
                p.alive = false;
                checkVictory();
            }
        });

        broadcastSync();
    }

    function broadcastSync() {
        let now = Date.now();
        if (now - lastSyncTime < 15) return;
        lastSyncTime = now;

        let data = {
            type: 'sync',
            players,
            globalTimer,
            shakeTimer,
            gameActive,
            fallingBlocks
        };
        connections.forEach(c => c.send(data));
        players.forEach(p => {
            let el = document.getElementById(`inv${p.id}`);
            if(el) el.innerText = p.inventory;
        });
    }

    function updateDying(p) {
        p.angle += 0.2;
        p.vy += 0.5;
        p.x += p.vx;
        p.y += p.vy;
        if (p.y > canvas.height + 1000) p.alive = false;
    }

    function updateFallingBlocks() {
        for (let i = fallingBlocks.length - 1; i >= 0; i--) {
            let b = fallingBlocks[i];
            b.vy += 0.5;
            b.y += b.vy;
            if (b.y > canvas.height + 1000) fallingBlocks.splice(i, 1);
        }
    }

    function drawSlime(ctx, p) {
        ctx.save();
        ctx.translate(p.x + p.w / 2, p.y + p.h);
        ctx.rotate(p.angle || 0);
        ctx.scale(p.stretch, p.squash);

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, -15, p.w * 0.8, Math.PI, 0);
        ctx.lineTo(p.w * 0.8, 0);
        ctx.quadraticCurveTo(0, 10, -p.w * 0.8, 0);
        ctx.fill();

        ctx.fillStyle = "white";
        let eyeOffset = p.vx * 0.5;
        let eyeY = p.isCrouching ? -12 : -23;
        ctx.beginPath();
        ctx.arc(-p.w * 0.3 + eyeOffset, eyeY, 4, 0, Math.PI * 2);
        ctx.arc(p.w * 0.3 + eyeOffset, eyeY, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        let hasContent = false;

        Object.keys(world).forEach(key => {
            let [x, y] = key.split(',').map(Number);
            minX = Math.min(minX, x * blockSize);
            maxX = Math.max(maxX, (x + 1) * blockSize);
            minY = Math.min(minY, y * blockSize);
            maxY = Math.max(maxY, (y + 1) * blockSize);
            hasContent = true;
        });

        if (hasContent) {
            let targetCamX = (minX + maxX) / 2;
            let targetCamY = (minY + maxY) / 2;
            let areaW = (maxX - minX) + blockSize * 4;
            let areaH = (maxY - minY) + blockSize * 8;
            let targetZoom = Math.min(1.2, Math.max(0.4, Math.min(canvas.width / areaW, canvas.height / areaH)));

            camX += (targetCamX - camX) * 0.08;
            camY += (targetCamY - camY) * 0.08;
            zoom += (targetZoom - zoom) * 0.08;
        }

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let offsetX = canvas.width / 2 - camX * zoom;
        let offsetY = canvas.height / 2 - camY * zoom;
        ctx.setTransform(zoom, 0, 0, zoom, offsetX, offsetY);

        ctx.save();
        if (shakeTimer > 0) {
            ctx.translate((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20);
            if (isHost) {
                shakeTimer--;
                if(shakeTimer === 15 && eliminationPending) {
                    executeElimination();
                    eliminationPending = false;
                }
            }
        }
        
        for (let key in world) {
            let [x, y] = key.split(',').map(Number);
            ctx.fillStyle = world[key];
            ctx.fillRect(x * blockSize, y * blockSize, blockSize - 1, blockSize - 1);
        }

        if (globalTimer <= 5) {
            let activeRow = getActiveRow();
            let dangerY = (activeRow + dangerRowOffset) * blockSize;
            let dangerAlpha = 0.15 + Math.sin(Date.now() * 0.015) * 0.1;
            if (globalTimer === 0 || eliminationPending) dangerAlpha = 0.7;
            ctx.fillStyle = `rgba(255, 0, 0, ${dangerAlpha})`;
            ctx.fillRect(-10000, dangerY, 20000, 10000);
        }

        fallingBlocks.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, blockSize - 1, blockSize - 1);
        });

        players.forEach(p => {
            if (!p.alive) return;
            drawSlime(ctx, p);
        });
        
        ctx.restore();
        requestAnimationFrame(draw);
    }

    const workerCode = "setInterval(function(){ postMessage('tick'); }, 16);";
    const workerBlob = new Blob([workerCode], { type: "application/javascript" });
    const loopWorker = new Worker(URL.createObjectURL(workerBlob));
    loopWorker.onmessage = function() {
        update();
    };

    draw();
</script>
</body>
</html>
